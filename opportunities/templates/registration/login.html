<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <title>Log In</title>

    <style>
        body {
            font-family: system-ui, sans-serif;
            max-width: 500px;
            margin: 60px auto;
            padding: 24px;
            line-height: 1.5;
        }

        .card {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 24px;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px;
        }

        button {
            padding: 10px 16px;
        }

        .error {
            color: #a00;
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>
            Research Opportunities
        </h1>

        <h2>
            Log in
        </h2>

        {% if form.errors %}
            <p class="error">
                Your username or password was incorrect.
                Please try again.
            </p>
        {% endif %}

        <form method="post">

            {% csrf_token %}

            <p>
                <label for="{{ form.username.id_for_label }}">
                    Username
                </label>

                {{ form.username }}
            </p>

            <p>
                <label for="{{ form.password.id_for_label }}">
                    Password
                </label>

                {{ form.password }}
            </p>

            {% if next %}
                <input
                    type="hidden"
                    name="next"
                    value="{{ next }}"
                >
            {% endif %}

            <button type="submit">
                Log in
            </button>

        </form>

    </div>

</body>

</html>
